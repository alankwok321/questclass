<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestClass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-page="landing">
  <main>
    <header class="topbar">
      <div class="brand" data-brand></div>
      <nav class="nav" data-nav></nav>
      <div class="topbar-auth" data-topbar-auth></div>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <span class="eyebrow">Multi-page learning app</span>
        <h1>把 QuestClass 拆成真的可維護產品骨架</h1>
        <p data-promise></p>
        <div class="inline-actions">
          <a class="button button-primary" href="/teacher">Teacher Dashboard</a>
          <a class="button button-ghost" href="/student">Student Home</a>
        </div>
      </div>
      <div class="hero-stats">
        <div><strong>5</strong><span>核心頁面</span></div>
        <div><strong>API</strong><span>Express endpoints 保留</span></div>
        <div><strong>Auth-ready</strong><span>Firebase / Google OAuth</span></div>
        <div><strong>Vercel</strong><span>server.js 單入口部署</span></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <span class="eyebrow">Product map</span>
          <h2>頁面分工</h2>
        </div>
      </div>
      <div class="grid-2" data-spotlight></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <span class="eyebrow">Build readiness</span>
          <h2>接下來可直接延伸的方向</h2>
        </div>
      </div>
      <ol data-roadmap></ol>
      <div data-firebase-status style="margin-top:16px;"></div>
    </section>
  </main>

  <div class="toast" data-toast></div>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-bridge.js"></script>
  <script src="/assets/app-browser.js"></script>
</body>
</html>
