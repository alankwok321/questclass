<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestClass Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-page="analytics">
  <main>
    <header class="topbar">
      <div class="brand" data-brand></div>
      <nav class="nav" data-nav></nav>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <span class="eyebrow">Analytics</span>
        <h1>弱點分析 / 題庫 / 知識地圖</h1>
        <p>這頁專注在資料視角，不混老師操作和學生任務。</p>
      </div>
      <div class="hero-stats">
        <div><strong>Heatmap</strong><span>弱點熱區</span></div>
        <div><strong>Bank</strong><span>題庫資料</span></div>
      </div>
    </section>

    <section class="panel">
      <div data-auth-panel></div>
    </section>

    <section class="panel">
      <div data-profile-panel></div>
      <div data-admin-panel style="margin-top:20px;"></div>
    </section>

    <section class="panel">
      <div class="panel-header"><div><span class="eyebrow">Unit coverage</span><h2>單元進度</h2></div></div>
      <div class="list-grid" data-units></div>
    </section>

    <section class="grid-2">
      <section class="panel">
        <div class="panel-header"><div><span class="eyebrow">Question bank</span><h3>題庫</h3></div></div>
        <div class="list-grid" data-question-bank></div>
      </section>
      <section class="panel">
        <div class="panel-header"><div><span class="eyebrow">Knowledge map</span><h3>知識地圖</h3></div></div>
        <div class="map-grid" data-knowledge-map></div>
      </section>
    </section>

    <section class="grid-2">
      <section class="panel">
        <div class="panel-header"><div><span class="eyebrow">Skills</span><h3>技能樹</h3></div></div>
        <div data-skills></div>
      </section>
      <section class="panel">
        <div class="panel-header"><div><span class="eyebrow">Heatmap</span><h3>弱點熱區</h3></div></div>
        <div class="heatmap" data-heatmap></div>
      </section>
    </section>

    <section class="panel">
      <div class="panel-header"><div><span class="eyebrow">Insights</span><h3>錯題關聯</h3></div></div>
      <div class="list-grid" data-mistake-links></div>
    </section>
  </main>

  <div class="toast" data-toast></div>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-bridge.js"></script>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
