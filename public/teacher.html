<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestClass Teacher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-page="teacher">
  <main>
    <header class="topbar">
      <div class="brand" data-brand></div>
      <nav class="nav" data-nav></nav>
    </header>

    <section class="hero" data-teacher-hero></section>

    <section class="panel auth-urgent-panel">
      <div class="panel-header"><div><span class="eyebrow">Login</span><h2>登入 / 切換帳號</h2></div></div>
      <p><button class="button button-primary" type="button" data-auth-action="google">使用 Google 登入</button></p>
      <div data-auth-panel></div>
    </section>

    <section class="panel">
      <div data-profile-panel></div>
      <div data-admin-panel style="margin-top:20px;"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div><span class="eyebrow">Teacher metrics</span><h2>班級總覽</h2></div>
      </div>
      <div class="metrics-grid" data-teacher-metrics></div>
    </section>

    <section class="grid-2">
      <section class="panel">
        <div class="panel-header">
          <div><span class="eyebrow">Classrooms</span><h3>班級切換</h3></div>
        </div>
        <div class="list-grid" data-classroom-list></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div><span class="eyebrow">Students</span><h3>焦點學生</h3></div>
        </div>
        <div class="list-grid" data-student-cards></div>
      </section>
    </section>

    <section class="grid-2">
      <section class="panel">
        <div class="panel-header">
          <div><span class="eyebrow">Lesson loop</span><h3>AI 教學流程</h3></div>
          <div>
            <span class="muted" data-loop-mode></span>
            <button class="button button-primary" data-run-loop>產生 lesson loop</button>
          </div>
        </div>
        <div data-loop-output></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div><span class="eyebrow">Teacher summary</span><h3>本輪重點</h3></div>
        </div>
        <ol data-teacher-summary></ol>
        <h4>建議題組</h4>
        <ul data-assignment></ul>
        <p class="muted" data-insight></p>
      </section>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div><span class="eyebrow">Integrations</span><h3>AI / Auth 設定</h3></div>
      </div>
      <div class="grid-2">
        <form data-settings-form></form>
        <div data-firebase-status></div>
      </div>
    </section>
  </main>

  <div class="toast" data-toast></div>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-bridge.js"></script>
  <script src="/assets/app-browser.js"></script>
</body>
</html>
