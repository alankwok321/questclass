<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestClass Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/chatbox.css" />
</head>
<body data-page="chat" class="chatbox-body">
  <div class="chatbox-shell">
    <header class="topbar">
      <div class="brand" data-brand></div>
      <nav class="nav" data-nav></nav>
      <div class="topbar-auth" data-topbar-auth></div>
    </header>

    <header class="chatbox-header">
      <div class="chatbox-title">
        <span class="chatbox-mark">QC</span>
        <div>
          <div class="chatbox-title-main">QuestClass · AI Chat</div>
          <div class="chatbox-title-sub" data-chat-status></div>
        </div>
      </div>
    </header>

    <section class="chatbox-context" data-chat-context></section>

    <main class="chatbox-main">
      <div class="chatbox-thread" data-chat-messages></div>

      <form class="chatbox-form" data-chat-form>
        <input class="chatbox-input" name="message" type="text" placeholder="例如：我不懂為什麼 3/4 會大於 2/3？" />
        <button class="button button-ghost" type="button" data-chat-clear>清空</button>
        <button class="button button-primary" type="submit">送出</button>
      </form>

      <div class="chatbox-quick" aria-label="Quick prompts">
        <button class="button button-ghost" type="button" data-seed-prompt="請一步步引導我，不要直接給答案">一步步引導</button>
        <button class="button button-ghost" type="button" data-seed-prompt="先給我提示，再讓我自己算">先提示</button>
        <button class="button button-ghost" type="button" data-seed-prompt="用生活例子解釋">生活例子</button>
      </div>

      <div class="chatbox-footer" data-firebase-status></div>
    </main>
  </div>

  <div class="toast" data-toast></div>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-bridge.js"></script>
  <script src="/assets/app-browser.js?v=3"></script>
</body>
</html>
