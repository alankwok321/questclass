<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestClass Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-page="chat">
  <main>
    <header class="topbar">
      <div class="brand" data-brand></div>
      <nav class="nav" data-nav></nav>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <span class="eyebrow">Chat-first learning</span>
        <h1>AI 老師對話區</h1>
        <p>保留 `/api/chat`，先用 demo data，填入 API key 後可直接切 live。</p>
      </div>
      <div class="hero-stats">
        <div><strong data-chat-mode>Demo mode</strong><span>目前模式</span></div>
        <div><strong>TRAD</strong><span>預設繁中回覆</span></div>
      </div>
    </section>

    <section class="panel auth-urgent-panel">
      <div class="panel-header"><div><span class="eyebrow">Login</span><h2>登入 / 切換帳號</h2></div></div>
      <p><button class="button button-primary" type="button" data-auth-action="google">使用 Google 登入</button></p>
      <div data-auth-panel></div>
    </section>

    <section class="panel">
      <div data-profile-panel></div>
      <div data-admin-panel style="margin-top:20px;"></div>
    </section>

    <section class="chat-shell">
      <section class="panel">
        <div class="panel-header"><div><span class="eyebrow">Conversation</span><h2>對話紀錄</h2></div></div>
        <div class="chat-thread" data-chat-messages></div>
        <form class="chat-form" data-chat-form>
          <input name="message" type="text" placeholder="例如：我不懂為什麼 3/4 會大於 2/3？" />
          <button class="button button-primary" type="submit">送出</button>
        </form>
        <div class="quick-actions">
          <button class="button button-ghost" type="button" data-seed-prompt="請一步步引導我，不要直接給答案">一步步引導</button>
          <button class="button button-ghost" type="button" data-seed-prompt="先給我提示，再讓我自己算">先提示</button>
          <button class="button button-ghost" type="button" data-seed-prompt="用生活例子解釋">生活例子</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header"><div><span class="eyebrow">Config</span><h3>AI / Firebase 設定</h3></div></div>
        <form data-settings-form></form>
        <div data-firebase-status style="margin-top:18px;"></div>
      </section>
    </section>
  </main>

  <div class="toast" data-toast></div>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-bridge.js"></script>
  <script src="/assets/app-browser.js"></script>
</body>
</html>
