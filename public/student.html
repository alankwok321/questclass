<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestClass Student</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-page="student">
  <main>
    <header class="topbar">
      <div class="brand" data-brand></div>
      <nav class="nav" data-nav></nav>
      <div class="topbar-auth" data-topbar-auth></div>
    </header>

    <section class="student-dashboard-layout">
      <aside class="panel student-sidebar">
        <div class="panel-header"><div><span class="eyebrow">Student selector</span><h2>學生清單</h2></div></div>
        <div class="student-sidebar-tools">
          <input type="search" placeholder="搜尋學生姓名" data-student-search />
          <select data-student-sort>
            <option value="name">依姓名</option>
            <option value="xp-desc">XP 高到低</option>
            <option value="mastery-asc">Mastery 低到高</option>
          </select>
        </div>
        <div class="student-sidebar-list" data-student-roster></div>
      </aside>

      <section class="student-main-column">
        <section class="hero" data-student-hero></section>

        <section class="panel student-data-panel" data-student-data-panel></section>

        <section class="panel" data-student-editor-panel></section>

        <section class="panel">
          <div class="panel-header"><div><span class="eyebrow">Student progress</span><h2>個人進度</h2></div></div>
          <div class="grid-3" data-student-progress></div>
        </section>

        <section class="panel">
          <div class="panel-header"><div><span class="eyebrow">Daily quests</span><h3>今日任務</h3></div></div>
          <div class="list-grid" data-quests></div>
        </section>
      </section>
    </section>
  </main>

  <div class="toast" data-toast></div>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-bridge.js"></script>
  <script src="/assets/app-browser.js?v=3"></script>
</body>
</html>
