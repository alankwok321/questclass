<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestClass Student</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-page="student">
  <main>
    <header class="topbar">
      <div class="brand" data-brand></div>
      <nav class="nav" data-nav></nav>
    </header>

    <section class="hero" data-student-hero></section>

    <section class="panel">
      <div class="panel-header"><div><span class="eyebrow">Student progress</span><h2>個人進度</h2></div></div>
      <div class="grid-3" data-student-progress></div>
    </section>

    <section class="grid-2">
      <section class="panel">
        <div class="panel-header"><div><span class="eyebrow">Daily quests</span><h3>今日任務</h3></div></div>
        <div class="list-grid" data-quests></div>
      </section>

      <section class="panel">
        <div class="panel-header"><div><span class="eyebrow">Student selector</span><h3>學生切換</h3></div></div>
        <div class="list-grid" data-student-roster></div>
      </section>
    </section>
  </main>

  <div class="toast" data-toast></div>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-bridge.js"></script>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
