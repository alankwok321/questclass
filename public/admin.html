<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestClass Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-page="admin">
  <main>
    <header class="topbar">
      <div class="brand" data-brand></div>
      <nav class="nav" data-nav></nav>
      <div class="topbar-auth" data-topbar-auth></div>
    </header>

    <section class="hero admin-hero">
      <div class="hero-copy">
        <span class="eyebrow">Admin Console</span>
        <h1>帳號 / 角色管理</h1>
        <p>集中查看使用者 profile、角色申請與帳號狀態，避免老師頁面混進管理操作。</p>
      </div>
      <div class="hero-stats">
        <div><strong data-admin-total-users>—</strong><span>Accounts</span></div>
        <div><strong data-admin-pending>—</strong><span>Pending role requests</span></div>
        <div><strong data-admin-issues>—</strong><span>Account issues</span></div>
        <div><strong data-admin-status>Checking</strong><span>Access status</span></div>
      </div>
    </section>

    <section class="panel" data-admin-access></section>

    <section class="grid-2 admin-layout">
      <section class="panel">
        <div class="panel-header">
          <div><span class="eyebrow">Account list</span><h2>所有帳號</h2></div>
          <button class="button button-ghost" type="button" data-admin-refresh>重新整理</button>
        </div>
        <div class="admin-toolbar">
          <input type="search" placeholder="搜尋姓名 / email / uid" data-admin-search />
          <select data-admin-filter>
            <option value="all">全部狀態</option>
            <option value="issue">只有問題帳號</option>
            <option value="pending">只有角色申請</option>
            <option value="admin">admin</option>
            <option value="teacher">teacher</option>
            <option value="student">student</option>
            <option value="suspended">suspended</option>
          </select>
        </div>
        <div class="list-grid admin-user-list" data-admin-user-list></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div><span class="eyebrow">Selected account</span><h2>帳號詳情</h2></div>
        </div>
        <div data-admin-detail></div>
      </section>
    </section>
  </main>

  <div class="toast" data-toast></div>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-bridge.js"></script>
  <script src="/assets/app-browser.js"></script>
</body>
</html>
