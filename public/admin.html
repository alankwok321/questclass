<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestClass Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-page="admin">
  <main>
    <header class="topbar">
      <div class="brand" data-brand></div>
      <nav class="nav" data-nav></nav>
      <div class="topbar-auth" data-topbar-auth></div>
    </header>

    <section class="hero admin-hero">
      <div class="hero-copy">
        <span class="eyebrow">Admin Console</span>
        <h1>帳號管理</h1>
        <p>集中查看帳號清單、基本資料與狀態，快速處理角色與帳號問題。</p>
        <p style="margin-top:10px;padding:10px 12px;border:2px solid #ff4d4f;border-radius:12px;font-weight:800;color:#ff4d4f;display:inline-block;">ADMIN BUILD v3 DEBUG</p>
      </div>
      <div class="hero-stats">
        <div><strong data-admin-total-users>—</strong><span>Accounts</span></div>
        <div><strong data-admin-pending>—</strong><span>Pending role requests</span></div>
        <div><strong data-admin-issues>—</strong><span>Account issues</span></div>
        <div><strong data-admin-status>Checking</strong><span>Access status</span></div>
      </div>
    </section>

    <section class="panel" data-admin-access></section>

    <section class="admin-layout">
      <section class="panel">
        <div class="panel-header">
          <div><span class="eyebrow">Account list</span><h2>所有帳號</h2></div>
          <button class="button button-ghost" type="button" data-admin-refresh>重新整理</button>
        </div>
        <div class="admin-toolbar">
          <input type="search" placeholder="搜尋姓名 / email / uid" data-admin-search />
          <select data-admin-filter>
            <option value="name">依姓名</option>
            <option value="admin">只看 admin</option>
            <option value="teacher">只看 teacher</option>
            <option value="student">只看 student</option>
            <option value="suspended">只看 suspended</option>
            <option value="review">只看 review</option>
          </select>
        </div>
        <div class="list-grid admin-user-list" data-admin-user-list></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div><span class="eyebrow">Selected account</span><h2>帳號詳情</h2></div>
        </div>
        <div data-admin-detail></div>

      </section>
    </section>
  </main>

  <div class="toast" data-toast></div>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/firebase-bridge.js"></script>
  <script src="/assets/app-browser.js?v=3"></script>
</body>
</html>
